[package]
name = "mingyun-time"
version = "3.1.8"
description = "茗韵时光 - 音乐播放器"
authors = ["MingYunTime"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mingyun_time_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "protocol-asset", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "cookies", "multipart"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
which = "6"
sysinfo = "0.31"
scraper = "0.20"
lofty = "0.21"
base64 = "0.22"
url = "2"
urlencoding = "2"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
chrono = "0.4"
md5 = "0.7"

[features]
custom-protocol = ["tauri/custom-protocol"]
